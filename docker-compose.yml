# COMUNIDAD 360 — infraestructura local de desarrollo
#
# Solo servicios de apoyo. Los servicios Spring Boot y React se añaden en FASE 2.
# No usar estas credenciales en producción. No contiene secretos reales.
#
# Uso:
#   docker compose up -d postgres s3mock mailpit
#   docker compose --profile redis up -d
#   docker compose down

name: comunidad360

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-comunidad360}
      POSTGRES_USER: ${POSTGRES_USER:-comunidad360}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comunidad360_local}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-comunidad360} -d ${POSTGRES_DB:-comunidad360}"]
      interval: 5s
      timeout: 5s
      retries: 10

  s3mock:
    image: adobe/s3mock:latest
    restart: unless-stopped
    ports:
      - "9090:9090"
      - "9191:9191"

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
    profiles: ["app"]
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-comunidad360}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-comunidad360}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-comunidad360_local}
      APP_SECURITY_JWT_SECRET: ${APP_SECURITY_JWT_SECRET:-dev-only-change-me-0123456789-abcdefghijklmnopqrstuvwxyz}
      APP_SECURITY_EXPOSE_DEV_TOKENS: "true"
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://127.0.0.1:3000,http://localhost:13000,http://127.0.0.1:13000
      APP_SEED_ENABLED: "true"
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      APP_MAIL_ENABLED: "true"
      APP_STORAGE_TYPE: s3
      APP_STORAGE_S3_ENDPOINT: http://s3mock:9090
      APP_STORAGE_S3_PUBLIC_ENDPOINT: http://localhost:9090
      APP_STORAGE_S3_ACCESS_KEY: test
      APP_STORAGE_S3_SECRET_KEY: test
      APP_STORAGE_S3_BUCKET: comunidad360-documents
      APP_STORAGE_S3_PATH_STYLE: "true"
      APP_STORAGE_S3_CREATE_BUCKET: "true"
      APP_STORAGE_LOCAL_PATH: /app/data/uploads
    ports:
      - "${BACKEND_HTTP_PORT:-8080}:8080"
    volumes:
      - incident_uploads:/app/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    profiles: ["app"]
    restart: unless-stopped
    ports:
      - "${FRONTEND_HTTP_PORT:-3000}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  incident_uploads:
