<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3f4f6"/>
      <stop offset="0.5" stop-color="#b8bec8"/>
      <stop offset="1" stop-color="#6b7280"/>
    </linearGradient>
    <linearGradient id="fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e5e7eb" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#d1d5db" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9ca3af" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <pattern id="windows-a" width="16" height="22" patternUnits="userSpaceOnUse">
      <rect width="16" height="22" fill="#1f2937"/>
      <rect x="3" y="4" width="6" height="11" fill="#d1d5db" opacity="0.5"/>
    </pattern>
    <pattern id="windows-b" width="20" height="20" patternUnits="userSpaceOnUse">
      <rect width="20" height="20" fill="#111827"/>
      <rect x="4" y="4" width="12" height="9" fill="#e5e7eb" opacity="0.35"/>
    </pattern>
    <pattern id="windows-c" width="14" height="18" patternUnits="userSpaceOnUse">
      <rect width="14" height="18" fill="#374151"/>
      <rect x="3" y="3" width="8" height="9" fill="#f3f4f6" opacity="0.3"/>
    </pattern>
  </defs>

  <rect width="1600" height="700" fill="url(#sky)"/>

  <!-- Distant skyline -->
  <g fill="#cbd5e1" opacity="0.8">
    <rect x="40" y="420" width="110" height="280"/>
    <rect x="170" y="380" width="90" height="320"/>
    <rect x="280" y="440" width="130" height="260"/>
    <rect x="430" y="400" width="70" height="300"/>
    <rect x="520" y="450" width="150" height="250"/>
    <rect x="690" y="370" width="110" height="330"/>
    <rect x="820" y="420" width="90" height="280"/>
    <rect x="930" y="390" width="120" height="310"/>
    <rect x="1070" y="430" width="100" height="270"/>
    <rect x="1190" y="400" width="140" height="300"/>
    <rect x="1350" y="440" width="90" height="260"/>
    <rect x="1460" y="390" width="120" height="310"/>
  </g>

  <!-- Mid skyline -->
  <g fill="#9ca3af" opacity="0.9">
    <rect x="20" y="470" width="130" height="230"/>
    <rect x="230" y="430" width="100" height="270"/>
    <rect x="350" y="480" width="150" height="220"/>
    <rect x="630" y="410" width="100" height="290"/>
    <rect x="760" y="450" width="120" height="250"/>
    <rect x="1210" y="420" width="110" height="280"/>
    <rect x="1400" y="460" width="160" height="240"/>
  </g>

  <!-- Mid windows -->
  <g opacity="0.35" fill="#f3f4f6">
    <rect x="250" y="460" width="10" height="10"/>
    <rect x="270" y="460" width="10" height="10"/>
    <rect x="290" y="460" width="10" height="10"/>
    <rect x="250" y="486" width="10" height="10"/>
    <rect x="270" y="486" width="10" height="10"/>
    <rect x="290" y="486" width="10" height="10"/>
    <rect x="250" y="512" width="10" height="10"/>
    <rect x="270" y="512" width="10" height="10"/>
    <rect x="290" y="512" width="10" height="10"/>
    <rect x="650" y="450" width="12" height="12"/>
    <rect x="675" y="450" width="12" height="12"/>
    <rect x="700" y="450" width="12" height="12"/>
    <rect x="650" y="478" width="12" height="12"/>
    <rect x="675" y="478" width="12" height="12"/>
    <rect x="700" y="478" width="12" height="12"/>
    <rect x="650" y="506" width="12" height="12"/>
    <rect x="675" y="506" width="12" height="12"/>
    <rect x="700" y="506" width="12" height="12"/>
  </g>

  <!-- Foreground skyscrapers -->
  <g>
    <!-- left tall tower -->
    <rect x="80" y="250" width="120" height="450" fill="url(#windows-c)"/>
    <rect x="80" y="240" width="120" height="12" fill="#111827"/>
    <rect x="132" y="200" width="6" height="42" fill="#111827"/>

    <!-- center-left tower -->
    <rect x="330" y="300" width="140" height="400" fill="url(#windows-a)"/>
    <rect x="330" y="288" width="140" height="14" fill="#111827"/>
    <rect x="395" y="230" width="8" height="60" fill="#111827"/>

    <!-- center tower -->
    <rect x="560" y="230" width="150" height="470" fill="url(#windows-b)"/>
    <rect x="560" y="216" width="150" height="16" fill="#111827"/>
    <rect x="630" y="150" width="10" height="68" fill="#111827"/>
    <rect x="600" y="190" width="70" height="28" fill="#111827"/>

    <!-- right cluster -->
    <rect x="820" y="280" width="130" height="420" fill="url(#windows-c)"/>
    <rect x="820" y="268" width="130" height="14" fill="#111827"/>

    <rect x="990" y="160" width="180" height="540" fill="url(#windows-b)"/>
    <rect x="990" y="144" width="180" height="18" fill="#111827"/>
    <rect x="1010" y="92" width="140" height="54" fill="#111827"/>
    <rect x="1070" y="52" width="10" height="42" fill="#111827"/>

    <rect x="1210" y="250" width="140" height="450" fill="url(#windows-a)"/>
    <rect x="1210" y="236" width="140" height="16" fill="#111827"/>
    <rect x="1274" y="176" width="8" height="62" fill="#111827"/>

    <rect x="1390" y="300" width="170" height="400" fill="url(#windows-c)"/>
    <rect x="1390" y="286" width="170" height="16" fill="#111827"/>
  </g>

  <!-- Fog at the base -->
  <rect y="520" width="1600" height="180" fill="url(#fog)"/>
</svg>
