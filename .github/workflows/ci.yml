name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Tests
        env:
          DOCKER_API_VERSION: "1.43"
        run: mvn -B verify -DargLine="-Dapi.version=1.43"

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Check i18n
        run: npm run check:i18n
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Audit production dependencies
        run: npm audit --omit=dev

  compose:
    name: Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose
        run: docker compose config --quiet

  e2e:
    name: E2E and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start stack
        run: docker compose --profile app up -d --build
      - name: Wait for stack
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login >/dev/null && curl -fsS http://localhost:8080/actuator/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --profile app logs
          exit 1
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npm run test:e2e
      - name: Logs on failure
        if: failure()
        run: docker compose --profile app logs --tail=200
      - name: Stop stack
        if: always()
        run: docker compose --profile app down
