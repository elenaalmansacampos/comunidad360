spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:comunidad360}}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    validate-on-migrate: true
  mail:
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  forward-headers-strategy: framework

app:
  seed:
    enabled: false
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS}
  security:
    jwt-secret: ${APP_SECURITY_JWT_SECRET}
    cookie-secure: true
    cookie-same-site: ${APP_SECURITY_COOKIE_SAME_SITE:Lax}
    expose-dev-tokens: false
  rate-limit:
    enabled: true
    auth-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:20}
    general-per-minute: ${APP_RATE_LIMIT_GENERAL_PER_MINUTE:300}
  malware-scan:
    enabled: ${APP_MALWARE_SCAN_ENABLED:true}
    host: ${APP_MALWARE_SCAN_HOST:clamav}
    port: ${APP_MALWARE_SCAN_PORT:3310}
    timeout-millis: ${APP_MALWARE_SCAN_TIMEOUT_MILLIS:5000}
  mail:
    enabled: ${APP_MAIL_ENABLED:true}
    from: ${APP_MAIL_FROM}
    from-name: ${APP_MAIL_FROM_NAME:Comunidad 360}
  storage:
    type: ${APP_STORAGE_TYPE:s3}
    s3:
      endpoint: ${APP_STORAGE_S3_ENDPOINT:http://localhost:9090}
      public-endpoint: ${APP_STORAGE_S3_PUBLIC_ENDPOINT:${APP_STORAGE_S3_ENDPOINT:http://localhost:9090}}
      region: ${APP_STORAGE_S3_REGION:auto}
      bucket: ${APP_STORAGE_S3_BUCKET:comunidad360-documents}
      access-key: ${APP_STORAGE_S3_ACCESS_KEY:missing}
      secret-key: ${APP_STORAGE_S3_SECRET_KEY:missing}
      path-style: ${APP_STORAGE_S3_PATH_STYLE:false}
      create-bucket: false
      signed-url-ttl-seconds: ${APP_STORAGE_SIGNED_URL_TTL_SECONDS:300}

logging:
  level:
    root: INFO
    com.comunidad360: INFO
