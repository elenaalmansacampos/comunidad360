openapi: 3.1.0
info:
  title: COMUNIDAD 360 API
  version: 0.1.0
  description: >
    Contrato inicial del núcleo del MVP. Es una propuesta de FASE 1 y no un
    contrato definitivo. Los endpoints de banca CSV, chat, proveedores,
    auditoría e IA se añadirán en una versión posterior. La implementación
    actual de finanzas (FASE 3.3), banca (FASE 3.4), incidencias (FASE 3.5),
    documentos (FASE 3.6), reuniones/notificaciones (FASE 3.7),
    dashboard/informes (FASE 3.8) y MVP+ (FASE 3.9) puede variar respecto a
    este borrador; consulta docs/API.md y los documentos de fase.
  contact:
    name: COMUNIDAD 360
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local
tags:
  - name: Auth
    description: Autenticación, sesiones e invitaciones
  - name: Me
    description: Perfil y preferencias del usuario
  - name: Communities
    description: Comunidades y dashboard
  - name: Structure
    description: Edificios, unidades y elementos comunes
  - name: Members
    description: Membresías, propietarios e inquilinos
  - name: Finance
    description: Ejercicios, cuotas, cargos, pagos y facturas
  - name: Incidents
    description: Incidencias y seguimiento
  - name: Documents
    description: Documentos y descargas
  - name: Meetings
    description: Reuniones y asistencia
  - name: Voting
    description: Votaciones consultivas (MVP+)
  - name: Notifications
    description: Notificaciones y preferencias

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Iniciar sesión
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión creada
          headers:
            Set-Cookie:
              description: Cookie de refresh HttpOnly
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Renovar access token
      security:
        - refreshCookie: []
      responses:
        "200":
          description: Token renovado
          headers:
            Set-Cookie:
              description: Nuevo refresh token rotado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Cerrar sesión actual
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/logout-all:
    post:
      tags: [Auth]
      operationId: logoutAll
      summary: Cerrar todas las sesiones
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/password/forgot:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      summary: Solicitar recuperación de contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "202":
          description: Solicitud aceptada con respuesta genérica
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /auth/password/reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Restablecer contraseña con token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, newPassword]
              properties:
                token:
                  type: string
                newPassword:
                  type: string
                  minLength: 12
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/email/verify:
    post:
      tags: [Auth]
      operationId: verifyEmail
      summary: Verificar email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "400":
          $ref: "#/components/responses/BadRequest"

  /auth/invitations/accept:
    post:
      tags: [Auth]
      operationId: acceptInvitation
      summary: Aceptar invitación y crear o vincular cuenta
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptInvitationRequest"
      responses:
        "201":
          description: Cuenta creada o membresía vinculada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          description: Invitación caducada o ya utilizada

  /me:
    get:
      tags: [Me]
      operationId: getMe
      summary: Obtener perfil y membresías
      responses:
        "200":
          description: Perfil del usuario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Me]
      operationId: updateMe
      summary: Actualizar perfil
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullName:
                  type: string
                  maxLength: 200
      responses:
        "200":
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"

  /me/language:
    put:
      tags: [Me]
      operationId: updateLanguage
      summary: Cambiar idioma preferido
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [language]
              properties:
                language:
                  $ref: "#/components/schemas/Language"
      responses:
        "200":
          description: Idioma actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"

  /me/notification-preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: Obtener preferencias de notificación
      responses:
        "200":
          description: Preferencias
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationPreference"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Notifications]
      operationId: updateNotificationPreferences
      summary: Actualizar preferencias de notificación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/NotificationPreference"
      responses:
        "200":
          description: Preferencias actualizadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationPreference"
        "400":
          $ref: "#/components/responses/BadRequest"

  /communities:
    get:
      tags: [Communities]
      operationId: listMyCommunities
      summary: Listar comunidades del usuario
      responses:
        "200":
          description: Comunidades accesibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommunitySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Communities]
      operationId: createCommunity
      summary: Crear comunidad (solo SUPER_ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommunityRequest"
      responses:
        "201":
          description: Comunidad creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Community"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
    get:
      tags: [Communities]
      operationId: getCommunity
      summary: Obtener comunidad
      responses:
        "200":
          description: Comunidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Community"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Communities]
      operationId: updateCommunity
      summary: Actualizar configuración
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommunityRequest"
      responses:
        "200":
          description: Comunidad actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Community"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/dashboard:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
    get:
      tags: [Communities]
      operationId: getDashboard
      summary: Obtener resumen del dashboard según rol
      responses:
        "200":
          description: Datos del dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Dashboard"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/buildings:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
    get:
      tags: [Structure]
      operationId: listBuildings
      summary: Listar edificios
      responses:
        "200":
          description: Edificios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Building"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Structure]
      operationId: createBuilding
      summary: Crear edificio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBuildingRequest"
      responses:
        "201":
          description: Edificio creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/buildings/{buildingId}:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
      - name: buildingId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Structure]
      operationId: getBuilding
      summary: Obtener edificio
      responses:
        "200":
          description: Edificio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Structure]
      operationId: updateBuilding
      summary: Actualizar edificio
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBuildingRequest"
      responses:
        "200":
          description: Edificio actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Building"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Structure]
      operationId: archiveBuilding
      summary: Archivar edificio sin unidades activas
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /communities/{communityId}/units:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
      - $ref: "#/components/parameters/Page"
      - $ref: "#/components/parameters/Size"
      - $ref: "#/components/parameters/Sort"
    get:
      tags: [Structure]
      operationId: listUnits
      summary: Listar unidades
      parameters:
        - name: buildingId
          in: query
          schema:
            type: string
            format: uuid
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/UnitType"
        - name: q
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Unidades paginadas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnitPage"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Structure]
      operationId: createUnit
      summary: Crear unidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUnitRequest"
      responses:
        "201":
          description: Unidad creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/units/{unitId}:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
      - name: unitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Structure]
      operationId: getUnit
      summary: Obtener unidad
      responses:
        "200":
          description: Unidad
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Structure]
      operationId: updateUnit
      summary: Actualizar unidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUnitRequest"
      responses:
        "200":
          description: Unidad actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Unit"
        "400":
          $ref: "#/components/responses/BadRequest"
    delete:
      tags: [Structure]
      operationId: archiveUnit
      summary: Archivar unidad
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /communities/{communityId}/units/{unitId}/ownerships:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
      - name: unitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Members]
      operationId: listOwnerships
      summary: Listar titularidad de una unidad
      responses:
        "200":
          description: Titularidades
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Ownership"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Members]
      operationId: createOwnership
      summary: Alta de titularidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOwnershipRequest"
      responses:
        "201":
          description: Titularidad creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ownership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/units/{unitId}/ownerships/{ownershipId}:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
      - name: unitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: ownershipId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Members]
      operationId: updateOwnership
      summary: Actualizar titularidad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnershipRequest"
      responses:
        "200":
          description: Titularidad actualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Ownership"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Members]
      operationId: endOwnership
      summary: Finalizar titularidad conservando histórico
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/units/{unitId}/tenancies:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
      - name: unitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Members]
      operationId: listTenancies
      summary: Listar alquileres de una unidad
      responses:
        "200":
          description: Alquileres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenancy"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Members]
      operationId: createTenancy
      summary: Autorizar inquilino
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTenancyRequest"
      responses:
        "201":
          description: Inquilino autorizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenancy"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/members:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
    get:
      tags: [Members]
      operationId: listMembers
      summary: Listar membresías
      responses:
        "200":
          description: Membresías
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Membership"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/invitations:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
    get:
      tags: [Members]
      operationId: listInvitations
      summary: Listar invitaciones
      responses:
        "200":
          description: Invitaciones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invitation"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Members]
      operationId: createInvitation
      summary: Invitar a una persona
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInvitationRequest"
      responses:
        "201":
          description: Invitación creada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/units/{unitId}/tenancies/{tenancyId}:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
      - name: unitId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: tenancyId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      tags: [Members]
      operationId: updateTenancy
      summary: Actualizar alquiler
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTenancyRequest"
      responses:
        "200":
          description: Alquiler actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenancy"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Members]
      operationId: revokeTenancy
      summary: Revocar alquiler conservando histórico
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/common-elements:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
    get:
      tags: [Structure]
      operationId: listCommonElements
      summary: Listar elementos comunes
      responses:
        "200":
          description: Elementos comunes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CommonElement"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Structure]
      operationId: createCommonElement
      summary: Crear elemento común
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommonElementRequest"
      responses:
        "201":
          description: Elemento común creado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonElement"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/common-elements/{elementId}:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
      - name: elementId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Structure]
      operationId: getCommonElement
      summary: Obtener elemento común
      responses:
        "200":
          description: Elemento común
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonElement"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Structure]
      operationId: updateCommonElement
      summary: Actualizar elemento común
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCommonElementRequest"
      responses:
        "200":
          description: Elemento común actualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommonElement"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      tags: [Structure]
      operationId: archiveCommonElement
      summary: Archivar elemento común
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/structure/summary:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
    get:
      tags: [Structure]
      operationId: getStructureSummary
      summary: Obtener resumen y validación de coeficientes
      responses:
        "200":
          description: Resumen de estructura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StructureSummary"
        "403":
          $ref: "#/components/responses/Forbidden"

  /communities/{communityId}/finance/summary:
    parameters:
      - $ref: "#/components/parameters/CommunityId"
    get:
      tags: [Finance]
      operationId: getFinanceSummary
      summary: Obtener resumen financiero
      parameters:
        - name: fiscalYearId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Resumen financiero
