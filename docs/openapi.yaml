components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: comunidad360_refresh

  parameters:
    CommunityId:
      name: communityId
      in: path
      required: true
      description: Identificador de la comunidad. El backend valida la membresía.
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      schema:
        type: string
        example: createdAt,desc
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        format: uuid

  responses:
    NoContent:
      description: Operación completada sin contenido
    BadRequest:
      description: Validación de entrada incorrecta
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: Sin permiso o fuera de la comunidad
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: Recurso no encontrado o no visible
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: Conflicto de versión, duplicado o idempotencia
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnprocessableEntity:
      description: Regla de negocio incumplida
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooManyRequests:
      description: Límite de peticiones superado
      headers:
        Retry-After:
          description: Segundos de espera recomendados
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Problem:
      type: object
      required: [type, title, status, code, messageKey, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
        messageKey:
          type: string
        params:
          type: object
          additionalProperties: true
        traceId:
          type: string

    Money:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]{1,4})?$"
      example: "1234.56"
      description: Importe decimal como string para evitar pérdida de precisión.

    Percentage:
      type: string
      pattern: "^-?[0-9]+(\\.[0-9]{1,6})?$"
      example: "12.345678"

    Language:
      type: string
      enum: ["es", "ca"]
      description: Idioma preferido. La arquitectura permite añadir más códigos.

    UnitType:
      type: string
      enum: ["VIVIENDA", "LOCAL", "GARAJE", "TRASTERO", "ELEMENTO_COMUN"]

    Role:
      type: string
      enum: ["SUPER_ADMIN", "COMMUNITY_ADMIN", "PRESIDENT", "SECRETARY", "TREASURER", "OWNER", "TENANT", "PROVIDER"]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    TokenResponse:
      type: object
      required: [accessToken, tokenType, expiresIn]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: ["Bearer"]
        expiresIn:
          type: integer
          example: 900

    AcceptInvitationRequest:
      type: object
      required: [token, fullName, password]
      properties:
        token:
          type: string
        fullName:
          type: string
          maxLength: 200
        password:
          type: string
          minLength: 12

    User:
      type: object
      required: [id, email, fullName, preferredLanguage, status]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        preferredLanguage:
          $ref: "#/components/schemas/Language"
        status:
          type: string
          enum: ["PENDING_VERIFICATION", "ACTIVE", "SUSPENDED", "DISABLED"]
        emailVerifiedAt:
          type: string
          format: date-time

    UserProfile:
      allOf:
        - $ref: "#/components/schemas/User"
        - type: object
          properties:
            memberships:
              type: array
              items:
                $ref: "#/components/schemas/CommunitySummary"

    CommunitySummary:
      type: object
      required: [id, name, roles, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        status:
          type: string
          enum: ["ACTIVE", "SUSPENDED", "ARCHIVED"]

    Community:
      type: object
      required: [id, name, timezone, defaultLanguage, currency, status]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        taxId:
          type: string
        address:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: string
        timezone:
          type: string
          example: Europe/Madrid
        defaultLanguage:
          $ref: "#/components/schemas/Language"
        currency:
          type: string
          enum: ["EUR"]
        status:
          type: string
          enum: ["ACTIVE", "SUSPENDED", "ARCHIVED"]

    CreateCommunityRequest:
      type: object
      required: [name, timezone, defaultLanguage, currency]
      properties:
        name:
          type: string
          maxLength: 200
        taxId:
          type: string
        address:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: string
        timezone:
          type: string
          default: Europe/Madrid
        defaultLanguage:
          $ref: "#/components/schemas/Language"
        currency:
          type: string
          enum: ["EUR"]

    UpdateCommunityRequest:
      type: object
      properties:
        name:
          type: string
        taxId:
          type: string
        address:
          type: string
        city:
          type: string
        province:
          type: string
        postalCode:
          type: string
        timezone:
          type: string
        defaultLanguage:
          $ref: "#/components/schemas/Language"
        version:
          type: integer

    Dashboard:
      type: object
      properties:
        community:
          $ref: "#/components/schemas/CommunitySummary"
        finance:
          $ref: "#/components/schemas/FinanceSummary"
        openIncidents:
          type: integer
        upcomingMeetings:
          type: array
          items:
            $ref: "#/components/schemas/Meeting"
        recentNotifications:
          type: array
          items:
            $ref: "#/components/schemas/Notification"

    Building:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
        floors:
          type: integer
        notes:
          type: string
        archivedAt:
          type: string
          format: date-time
        version:
          type: integer

    CreateBuildingRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          maxLength: 200
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
        floors:
          type: integer
        notes:
          type: string

    UpdateBuildingRequest:
      type: object
      properties:
        name:
          type: string
        address:
          type: string
        city:
          type: string
        postalCode:
          type: string
        floors:
          type: integer
        notes:
          type: string
        version:
          type: integer

    Unit:
      type: object
      required: [id, code, type, coefficient, status]
      properties:
        id:
          type: string
          format: uuid
        buildingId:
          type: string
          format: uuid
        buildingName:
          type: string
        code:
          type: string
