databases:
  - name: comunidad360-db
    databaseName: comunidad360
    plan: free
    region: frankfurt

services:
  - type: web
    name: comunidad360-api
    runtime: docker
    plan: free
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase:
          name: comunidad360-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: comunidad360-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: comunidad360-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: comunidad360-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: comunidad360-db
          property: password
      - key: APP_SECURITY_JWT_SECRET
        generateValue: true
      - key: APP_CORS_ALLOWED_ORIGINS
        value: https://comunidad360-web-q2ln.onrender.com,https://elenaalmansacampos.github.io
      - key: APP_BOOTSTRAP_ENABLED
        value: "true"
      - key: APP_BOOTSTRAP_EMAIL
        sync: false
      - key: APP_BOOTSTRAP_PASSWORD
        sync: false
      - key: APP_BOOTSTRAP_COMMUNITY_NAME
        value: Mi Comunidad
      - key: APP_SEED_ENABLED
        value: "false"
      - key: APP_RATE_LIMIT_ENABLED
        value: "true"
      - key: APP_RATE_LIMIT_AUTH_PER_MINUTE
        value: "20"
      - key: APP_RATE_LIMIT_GENERAL_PER_MINUTE
        value: "300"
      - key: APP_PUSH_ENABLED
        value: "true"
      - key: APP_PUSH_SUBJECT
        value: mailto:no-reply@comunidad360.local
      - key: APP_PUSH_PUBLIC_KEY
        sync: false
      - key: APP_PUSH_PRIVATE_KEY
        sync: false
      - key: APP_MALWARE_SCAN_ENABLED
        value: "false"
      - key: APP_MAIL_ENABLED
        value: "false"
      - key: SPRING_MAIL_HOST
        value: localhost
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: APP_MAIL_FROM
        value: no-reply@comunidad360.local
      - key: APP_MAIL_FROM_NAME
        value: Comunidad 360
      - key: APP_STORAGE_TYPE
        value: database
      - key: APP_STORAGE_LOCAL_PATH
        value: /app/data/uploads
      - key: APP_STORAGE_S3_ENDPOINT
        sync: false
      - key: APP_STORAGE_S3_PUBLIC_ENDPOINT
        sync: false
      - key: APP_STORAGE_S3_REGION
        value: auto
      - key: APP_STORAGE_S3_BUCKET
        sync: false
      - key: APP_STORAGE_S3_ACCESS_KEY
        sync: false
      - key: APP_STORAGE_S3_SECRET_KEY
        sync: false
      - key: APP_STORAGE_S3_PATH_STYLE
        value: "true"
      - key: APP_STORAGE_S3_CREATE_BUCKET
        value: "false"
      - key: APP_STORAGE_SIGNED_URL_TTL_SECONDS
        value: "300"

  - type: web
    name: comunidad360-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: https://comunidad360-api-ihic.onrender.com/api/v1
      - key: VITE_BASE_PATH
        value: /
      - key: VITE_DEMO_MODE
        value: "false"
      - key: NODE_VERSION
        value: "22"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://comunidad360-api-ihic.onrender.com wss://comunidad360-api-ihic.onrender.com; worker-src 'self'; frame-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
      - path: /assets/*
        name: Cache-Control
        value: "public, max-age=31536000, immutable"
